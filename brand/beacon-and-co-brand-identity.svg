  <text x="176" y="130" font-family="'Playfair Display',Georgia,serif" font-size="76" font-weight="700" fill="#1a1712" letter-spacing="-1.5">Beacon <tspan font-style="italic" font-weight="600" fill="#7a9e72" font-size="52">&amp; Co.</tspan></text>
</g>
<text x="90" y="250" font-family="'Geist Mono',monospace" font-size="12" letter-spacing="2" fill="#8a8578">PRIMARY LOCKUP — THE "&amp; CO." SIGNALS ESTABLISHED, LOCAL, TRUSTED — SAME REGISTER AS A GENERAL STORE, NOT A STARTUP</text>

