<text x="90" y="720" font-family="'Geist Mono',monospace" font-size="12" letter-spacing="2" fill="#8a8578">ICON ALONE — FAVICON · SOCIAL AVATAR · APP TILE · TRUCK DOOR</text>

<!-- ═══ 4. Minimum size + clear space guide ═══ -->
<g transform="translate(90,770)">
  <rect x="0" y="0" width="32" height="32" rx="6" fill="#fdfcf8" stroke="#e2ddcf"/>
  <g transform="translate(16,16) scale(0.55)"><circle cx="0" cy="0" r="2.99" fill="#c49a48"/>
  <path d="M6.40 -8.20 A10.40 10.40 0 0 1 10.30 1.45" fill="none" stroke="#2a4228" stroke-width="70.20" stroke-linecap="round" opacity="0.5"/>
  <path d="M10.56 -13.52 A17.16 17.16 0 0 1 16.99 2.39" fill="none" stroke="#2a4228" stroke-width="59.80" stroke-linecap="round" opacity="0.78"/>
  <path d="M15.37 -19.67 A24.96 24.96 0 0 1 24.72 3.47" fill="none" stroke="#2a4228" stroke-width="48.10" stroke-linecap="round" opacity="1.0"/></g>
  <text x="46" y="12" font-family="'Geist Mono',monospace" font-size="11" fill="#1a1712">MIN SIZE 32px — arcs still read as three distinct strokes</text>
  <text x="46" y="30" font-family="'Geist Mono',monospace" font-size="11" fill="#8a8578">Clear space: minimum 0.5× the icon's own height on all sides</text>
</g>

<!-- ═══ 5. Color + type specimen ═══ -->
<g transform="translate(560,540)">
  <rect x="0" y="0" width="80" height="80" rx="10" fill="#2a4228"/><text x="0" y="98" font-family="'Geist Mono',monospace" font-size="10" fill="#1a1712">FOREST</text><text x="0" y="112" font-family="'Geist Mono',monospace" font-size="10" fill="#8a8578">#2a4228</text>
  <rect x="110" y="0" width="80" height="80" rx="10" fill="#c49a48"/><text x="110" y="98" font-family="'Geist Mono',monospace" font-size="10" fill="#1a1712">GOLD</text><text x="110" y="112" font-family="'Geist Mono',monospace" font-size="10" fill="#8a8578">#c49a48</text>
  <rect x="220" y="0" width="80" height="80" rx="10" fill="#7a9e72"/><text x="220" y="98" font-family="'Geist Mono',monospace" font-size="10" fill="#1a1712">SAGE</text><text x="220" y="112" font-family="'Geist Mono',monospace" font-size="10" fill="#8a8578">#7a9e72</text>
  <rect x="330" y="0" width="80" height="80" rx="10" fill="#fdfcf8" stroke="#e2ddcf" stroke-width="2"/><text x="330" y="98" font-family="'Geist Mono',monospace" font-size="10" fill="#1a1712">CREAM</text><text x="330" y="112" font-family="'Geist Mono',monospace" font-size="10" fill="#8a8578">#fdfcf8</text>
  <text x="0" y="160" font-family="'Playfair Display',serif" font-size="28" font-weight="700" fill="#1a1712">Playfair Display — headlines</text>
  <text x="0" y="196" font-family="'Geist Mono',monospace" font-size="16" fill="#1a1712">Geist Mono — eyebrows &amp; labels</text>
</g>

<!-- ═══ 6. Rationale ═══ -->
<foreignObject x="1000" y="540" width="320" height="330">
  <div xmlns="http://www.w3.org/1999/xhtml" style="font-family:'DM Sans',sans-serif;font-size:13px;line-height:1.65;color:#1a1712">
    <b style="font-family:'Geist Mono',monospace;font-size:10px;letter-spacing:2px;color:#8a8578">WHY &amp; CO.</b><br/><br/>
    Adds real distance from Beacon Roofing Supply's registered lighthouse mark without losing the core word or the sound-symbolism research behind it.<br/><br/>
    "&amp; Co." is a genuine small-business register — general stores, family hardware shops, the exact tone this proposal has argued Veslyn should own against page-mill competitors.<br/><br/>
    "Est. Waynesboro, VA" as a permanent eyebrow line does double duty: hyperlocal credibility on every use of the mark, and a second, harder-to-collide layer on top of the name itself.
  </div>
</foreignObject>
</svg>