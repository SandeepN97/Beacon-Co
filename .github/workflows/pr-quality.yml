name: PR quality

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: pr-quality-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Run quality and agent contract gates
        run: npm run ci:quality
      - name: Package immutable build input
        run: |
          tar --sort=name --mtime='UTC 1970-01-01' --owner=0 --group=0 --numeric-owner -czf beacon-dist.tar.gz dist
          sha256sum beacon-dist.tar.gz > beacon-dist.tar.gz.sha256
      - name: Generate redacted build evidence
        run: npm run security:evidence
      - name: Generate signed build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: beacon-dist.tar.gz
      - name: Upload promotion package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: beacon-build-${{ github.sha }}
          path: |
            beacon-dist.tar.gz
            beacon-dist.tar.gz.sha256
            evidence/build-evidence.json
          if-no-files-found: error
          retention-days: 14
