name: PR quality

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: pr-quality-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Node
        uses: actions/setup-node@1e60f620b9541d16bece96c5465dc8ee9832be0b # v4.0.3
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run ci:quality
      - name: Package immutable build input
        run: |
          tar --sort=name --mtime='UTC 1970-01-01' --owner=0 --group=0 --numeric-owner -czf beacon-dist.tar.gz dist
          sha256sum beacon-dist.tar.gz > beacon-dist.tar.gz.sha256
      - name: Generate redacted build evidence
        run: npm run security:evidence
      - name: Upload promotion package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: beacon-build-${{ github.sha }}
          path: |
            beacon-dist.tar.gz
            beacon-dist.tar.gz.sha256
            evidence/build-evidence.json
          if-no-files-found: error
          retention-days: 14
