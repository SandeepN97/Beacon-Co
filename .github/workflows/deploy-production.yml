name: Deploy production

on:
  workflow_dispatch:
    inputs:
      artifact_run_id:
        description: "Successful PR quality workflow run ID"
        required: true
        type: string
      commit_sha:
        description: "Full commit SHA on main represented by the artifact"
        required: true
        type: string
      expected_sha256:
        description: "Expected SHA-256 of beacon-dist.tar.gz"
        required: true
        type: string

permissions: {}

concurrency:
  group: production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    permissions:
      actions: read
      attestations: read
      contents: read
    steps:
      - name: Check out reviewed deployment code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.commit_sha }}
          fetch-depth: 0
      - name: Require the requested commit to be on main
        env:
          COMMIT_SHA: ${{ inputs.commit_sha }}
        run: |
          node -e "if(!/^[a-f0-9]{40}$/.test(process.env.COMMIT_SHA))process.exit(1)"
          git merge-base --is-ancestor "$COMMIT_SHA" origin/main
      - name: Download the tested artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: beacon-build-${{ inputs.commit_sha }}
          path: promotion
          run-id: ${{ inputs.artifact_run_id }}
          github-token: ${{ github.token }}
      - name: Verify signed build provenance
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh attestation verify promotion/beacon-dist.tar.gz --repo "$GITHUB_REPOSITORY"
      - name: Verify and extract artifact
        env:
          EXPECTED_SHA256: ${{ inputs.expected_sha256 }}
        run: |
          node -e "if(!/^[a-f0-9]{64}$/.test(process.env.EXPECTED_SHA256))process.exit(1)"
          test "$(sha256sum promotion/beacon-dist.tar.gz | cut -d' ' -f1)" = "$EXPECTED_SHA256"
          tar -xzf promotion/beacon-dist.tar.gz
      - name: Deploy production Worker
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v4.0.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_PRODUCTION_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --name beaconco9
      - name: Set up Node for evidence validation
        uses: actions/setup-node@1e60f620b9541d16bece96c5465dc8ee9832be0b # v4.0.3
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Record external production gate evidence
        run: npm run release:evidence:record -- --type approval --environment production --commit "${{ inputs.commit_sha }}" --artifact-sha256 "${{ inputs.expected_sha256 }}" --external-approval true
      - name: Record production promotion evidence
        run: npm run release:evidence:record -- --type promotion --environment production --commit "${{ inputs.commit_sha }}" --artifact-sha256 "${{ inputs.expected_sha256 }}"
      - name: Upload production promotion evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: beacon-production-promotion-${{ inputs.commit_sha }}
          path: evidence/release/*.json
          if-no-files-found: error
          retention-days: 90
