name: PR prepublish

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions: {}

concurrency:
  group: pr-prepublish-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  prepublish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install the locked Chromium runtime
        run: npx playwright install --with-deps chromium
      - name: Select publication manifest
        id: manifest
        run: |
          SELECTED=$(node --disable-warning=ExperimentalWarning --experimental-strip-types \
            scripts/ci/select-publication-manifest.mjs --base origin/main --head HEAD \
            --candidate agent-platform/publication/dependency-updates.json \
            --candidate agent-platform/publication/process-and-docs.json \
            --candidate agent-platform/publication/pr-0-5-capacity-watcher.json \
            --candidate agent-platform/publication/pr-0a-architectural-invariants.json \
            --candidate agent-platform/publication/phase-1.5-closure-hardening.json)
          echo "path=$SELECTED" >> "$GITHUB_OUTPUT"
      - name: Run prepublication evidence gate
        env:
          MANIFEST: ${{ steps.manifest.outputs.path }}
        run: npm run ci:prepublish -- --base origin/main --manifest "$MANIFEST"
      - name: Upload prepublication evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: prepublish-evidence-${{ github.event.pull_request.head.sha }}
          path: |
            evidence/publication-readiness.json
            evidence/publication-evidence.json
          if-no-files-found: error
          retention-days: 14
