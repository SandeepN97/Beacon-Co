name: PR prepublish

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions: {}

concurrency:
  group: pr-prepublish-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  prepublish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: Set up Node
        uses: actions/setup-node@1e60f620b9541d16bece96c5465dc8ee9832be0b # v4.0.3
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install the locked Chromium runtime
        run: npx playwright install --with-deps chromium
      - name: Run prepublication evidence gate
        run: npm run ci:prepublish -- --base origin/main
      - name: Upload prepublication evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: prepublish-evidence-${{ github.event.pull_request.head.sha }}
          path: |
            evidence/publication-readiness.json
            evidence/publication-evidence.json
          if-no-files-found: error
          retention-days: 14
