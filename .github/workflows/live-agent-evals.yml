name: Live agent evals

on:
  workflow_dispatch:
    inputs:
      provider:
        description: "Provider adapter to exercise"
        required: true
        type: choice
        options: [claude, codex]
      model:
        description: "Approved resolved model ID to record"
        required: true
        type: string

permissions: {}

concurrency:
  group: live-agent-evals-${{ inputs.provider }}
  cancel-in-progress: false

jobs:
  live-eval:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: agent-evals
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node
        uses: actions/setup-node@1e60f620b9541d16bece96c5465dc8ee9832be0b # v4.0.3
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Execute credential-gated narrow live WorkUnit
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: npm run agents:eval:live -- --provider "${{ inputs.provider }}" --model "${{ inputs.model }}" --sink ci
      - name: Upload redacted live telemetry and eval evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: beacon-live-agent-eval-${{ github.run_id }}
          path: |
            evidence/telemetry/*.ndjson
            evidence/evals/*.json
          if-no-files-found: error
          retention-days: 14
