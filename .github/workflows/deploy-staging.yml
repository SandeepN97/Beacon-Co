name: Deploy staging

on:
  workflow_dispatch:
    inputs:
      artifact_run_id:
        description: "Successful PR quality workflow run ID"
        required: true
        type: string
      commit_sha:
        description: "Full commit SHA represented by the artifact"
        required: true
        type: string
      expected_sha256:
        description: "Expected SHA-256 of beacon-dist.tar.gz"
        required: true
        type: string

permissions: {}

concurrency:
  group: staging
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: staging
    permissions:
      actions: read
      contents: read
    steps:
      - name: Check out reviewed deployment code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.commit_sha }}
      - name: Download the tested artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: beacon-build-${{ inputs.commit_sha }}
          path: promotion
          run-id: ${{ inputs.artifact_run_id }}
          github-token: ${{ github.token }}
      - name: Verify and extract artifact
        env:
          EXPECTED_SHA256: ${{ inputs.expected_sha256 }}
        run: |
          node -e "if(!/^[a-f0-9]{64}$/.test(process.env.EXPECTED_SHA256))process.exit(1)"
          test "$(sha256sum promotion/beacon-dist.tar.gz | cut -d' ' -f1)" = "$EXPECTED_SHA256"
          tar -xzf promotion/beacon-dist.tar.gz
      - name: Deploy staging Worker
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v4.0.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_STAGING_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --name beaconco9-staging
