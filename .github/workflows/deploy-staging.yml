name: Deploy staging

on:
  workflow_dispatch:
    inputs:
      artifact_run_id:
        description: "Successful PR quality workflow run ID"
        required: true
        type: string
      commit_sha:
        description: "Full commit SHA represented by the artifact"
        required: true
        type: string
      expected_sha256:
        description: "Expected SHA-256 of beacon-dist.tar.gz"
        required: true
        type: string

permissions: {}

concurrency:
  group: staging
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: staging
    permissions:
      actions: read
      attestations: read
      contents: read
    steps:
      - name: Check out reviewed deployment code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.commit_sha }}
      - name: Download the tested artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: beacon-build-${{ inputs.commit_sha }}
          path: promotion
          run-id: ${{ inputs.artifact_run_id }}
          github-token: ${{ github.token }}
      - name: Verify signed build provenance
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh attestation verify promotion/beacon-dist.tar.gz --repo "$GITHUB_REPOSITORY"
      - name: Verify and extract artifact
        env:
          EXPECTED_SHA256: ${{ inputs.expected_sha256 }}
        run: |
          node -e "if(!/^[a-f0-9]{64}$/.test(process.env.EXPECTED_SHA256))process.exit(1)"
          test "$(sha256sum promotion/beacon-dist.tar.gz | cut -d' ' -f1)" = "$EXPECTED_SHA256"
          tar -xzf promotion/beacon-dist.tar.gz
      - name: Deploy staging Worker
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v4.0.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_STAGING_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --name beaconco9-staging
      - name: Set up Node for evidence validation
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Record staging promotion evidence
        run: npm run release:evidence:record -- --type promotion --environment staging --commit "${{ inputs.commit_sha }}" --artifact-sha256 "${{ inputs.expected_sha256 }}"
      - name: Upload staging promotion evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: beacon-staging-promotion-${{ inputs.commit_sha }}
          path: evidence/release/*.json
          if-no-files-found: error
          retention-days: 30
