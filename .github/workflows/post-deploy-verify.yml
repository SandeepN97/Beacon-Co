name: Post-deploy verification

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Environment whose deployed artifact is being verified"
        required: true
        type: choice
        options: [staging, production]
      target_url:
        description: "HTTPS beaconco9.workers.dev URL to verify"
        required: true
        type: string
      commit_sha:
        description: "Reviewed commit represented by the deployed artifact"
        required: true
        type: string
      artifact_sha256:
        description: "SHA-256 of the deployed beacon-dist.tar.gz"
        required: true
        type: string

permissions: {}

concurrency:
  group: post-deploy-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: ${{ inputs.environment }}
    permissions:
      contents: read
    steps:
      - name: Check out evidence code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.commit_sha }}
      - name: Set up Node
        uses: actions/setup-node@1e60f620b9541d16bece96c5465dc8ee9832be0b # v4.0.3
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Validate target boundary
        env:
          TARGET_URL: ${{ inputs.target_url }}
        run: |
          node -e "const u=new URL(process.env.TARGET_URL);if(u.protocol!=='https:'||!/(^|\\.)workers\\.dev$/.test(u.hostname))process.exit(1)"
      - name: Verify status and security headers
        env:
          TARGET_URL: ${{ inputs.target_url }}
        run: |
          curl --fail --silent --show-error --location --max-time 20 --output /dev/null \
            --dump-header headers.txt "$TARGET_URL"
          grep -iq '^content-security-policy:' headers.txt
          grep -iq '^strict-transport-security:' headers.txt
          grep -iq '^x-content-type-options: nosniff' headers.txt
      - name: Record post-deploy verification evidence
        run: npm run release:evidence:record -- --type verification --environment "${{ inputs.environment }}" --commit "${{ inputs.commit_sha }}" --artifact-sha256 "${{ inputs.artifact_sha256 }}"
      - name: Upload verification evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: beacon-${{ inputs.environment }}-verification-${{ inputs.commit_sha }}
          path: evidence/release/*.json
          if-no-files-found: error
          retention-days: 90
