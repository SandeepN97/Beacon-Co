name: Agent platform

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: agent-platform-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  contracts-policy-evals:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Set up Node
        uses: actions/setup-node@1e60f620b9541d16bece96c5465dc8ee9832be0b # v4.0.3
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Validate contracts, policy, and deterministic evals
        run: npm run agents:check
      - name: Generate diff-bound non-authorizing publication evidence
        if: github.event_name == 'pull_request'
        run: npm run publication:generate -- --base "${{ github.event.pull_request.base.sha }}" --head "${{ github.event.pull_request.head.sha }}"
      - name: Upload publication evidence
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: beacon-publication-evidence-${{ github.sha }}
          path: evidence/publication-evidence.json
          if-no-files-found: error
          retention-days: 14
