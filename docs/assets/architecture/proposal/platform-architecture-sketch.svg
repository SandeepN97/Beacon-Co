<svg class="sketch" viewBox="0 0 1080 460" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Hand-drawn diagram of the system architecture" aria-labelledby="title-2"><title id="title-2">Beacon &amp; Co. proposed platform architecture</title><style>
  :root {
