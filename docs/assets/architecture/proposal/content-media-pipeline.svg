<svg class="sketch" viewBox="0 0 1450 760" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Detailed video and image content pipeline with phase split" aria-labelledby="title-5"><title id="title-5">Content and media pipeline</title><style>
