<svg viewBox="0 0 620 340" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title-8"><title id="title-8">Single-CTA attention example</title><style>
  :root {
    --forest: #2a4228;
    --cream: #fdfcf8;
    --ink: #1a1712;
    --ink2: #5a5548;
    --red: #a03d2e;
  }
  svg { background: var(--cream); }
  text {
    fill: var(--ink);
    font-family: "DM Sans", Arial, sans-serif;
  }
  .sketch .st {
    fill: none;
    stroke: var(--ink);
    stroke-dasharray: none !important;
    stroke-dashoffset: 0 !important;
    stroke-linecap: round;
    stroke-linejoin: round;
    stroke-width: 2.2;
  }
  .sketch .st.green { stroke: var(--forest); }
  .sketch .st.gold { stroke: #a8842e; }
  .sketch .st.red { stroke: var(--red); }
  .sketch .st.sage { stroke: #4a6640; }
  .sketch .st.purple { stroke: #7c5e99; }
  .sketch .st.blue { stroke: #3d6a8a; }
  .sketch .st.dash { stroke-dasharray: 6 5 !important; }
  .sketch .t-big { font-size: 23px; font-weight: 700; }
  .sketch .t-md { font-size: 17px; font-weight: 600; }
  .sketch .t-sm { fill: var(--ink2); font-size: 13.5px; }
  .sketch .t-green { fill: var(--forest); }
  .sketch .t-gold { fill: #a8842e; }
  .sketch .t-red { fill: var(--red); }
</style>
<defs>
  <radialGradient id="hotC" cx="50%" cy="50%" r="50%"><stop offset="0%" stop-color="#e63946" stop-opacity="0.75"></stop><stop offset="100%" stop-color="#e63946" stop-opacity="0"></stop></radialGradient>
  <radialGradient id="hotD" cx="50%" cy="50%" r="50%"><stop offset="0%" stop-color="#f4a340" stop-opacity="0.5"></stop><stop offset="100%" stop-color="#f4a340" stop-opacity="0"></stop></radialGradient>
</defs>
