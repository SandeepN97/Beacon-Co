<rect x="20" y="20" width="580" height="40" rx="6" fill="#e2ddcf"></rect>
<rect x="20" y="80" width="340" height="18" rx="3" fill="#c9c4b4"></rect>
<rect x="20" y="106" width="260" height="14" rx="3" fill="#dcd7c8"></rect>
