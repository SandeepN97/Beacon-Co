      - codebase-researcher
      - code-writer
      - qa-engineer
      - pr-reviewer
      - release-manager
    security:
      maxDataClassification: internal
      approvalRequirements: []
    deterministicTests:
      - manifest-schema
      - fixed-role-set
      - frontmatter-drift
      - tool-policy
      - budget-bounds
      - handoff-graph
      - output-contract
      - approval-contract
    liveEvalScenarios:
      - provider-unavailable-handoff
      - context-overflow
      - prompt-injection-attempt
