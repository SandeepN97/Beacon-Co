    allowedTools: [Read, Glob, Grep, Write, Edit, Bash]
    forbiddenToolClasses:
      - secret-access
      - scope-escape
      - dependency-mutation
      - git-history-rewrite
      - git-remote-mutation
      - pr-state-mutation
      - direct-deploy
      - external-side-effect
      - self-certification
      - approval-bypass
    provider:
      default: claude
      eligible: [claude, codex]
      claudeModelClass: sonnet
      routingStrategy: code-affinity
    execution:
      permissionMode: default
      isolation: worktree
      memory: none
    limits:
      maxContextTokens: 24000
      maxOutputTokens: 4000
      maxTurns: 20
    requiredInputFields:
      [objective, scopedPaths, acceptanceCriteria, constraints, researchEvidence, requiredChecks]
    output:
