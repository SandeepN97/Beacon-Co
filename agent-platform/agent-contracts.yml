    allowedTools: [Read, Glob, Grep, WebSearch, WebFetch]
    forbiddenToolClasses:
      - secret-access
      - scope-escape
      - source-mutation
      - mutating-shell
      - dependency-mutation
      - git-history-rewrite
      - git-remote-mutation
      - pr-state-mutation
      - direct-deploy
      - external-side-effect
      - self-certification
      - approval-bypass
    provider:
      default: claude
      eligible: [claude, codex]
      claudeModelClass: sonnet
      routingStrategy: claude-first
    execution:
      permissionMode: plan
      isolation: none
      memory: none
    limits:
      maxContextTokens: 14000
      maxOutputTokens: 2600
      maxTurns: 12
    requiredInputFields: [researchQuestion, serviceRadius, existingClaims, sourceRequirements]
    output:
      format: markdown
      requiredSections: [question, findings, claimComparison, recommendation, riskLevel]
    allowedHandoffs: [chief-of-staff]
    security:
      maxDataClassification: public
      approvalRequirements: [business-scope-change, external-contact]
    deterministicTests:
      - manifest-schema
      - fixed-role-set
      - frontmatter-drift
      - tool-policy
      - budget-bounds
      - handoff-graph
      - output-contract
      - approval-contract
    liveEvalScenarios:
      - documentation-only-change
      - ambiguous-request-decomposition
      - prompt-injection-attempt

