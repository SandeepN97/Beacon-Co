    allowedTools: [Read, Glob, Grep]
    forbiddenToolClasses:
      - secret-access
      - scope-escape
      - source-mutation
      - mutating-shell
      - dependency-mutation
      - git-history-rewrite
      - git-remote-mutation
      - pr-state-mutation
      - direct-deploy
      - external-side-effect
      - self-certification
      - approval-bypass
    provider:
      default: claude
      eligible: [claude, codex]
      claudeModelClass: haiku
      routingStrategy: capacity-aware
    execution:
