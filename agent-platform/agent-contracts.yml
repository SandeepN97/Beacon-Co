schemaVersion: 1
phase: "1.5"

roleSet:
  fixed: true
  count: 8

providers:
  - claude
  - codex

toolCatalog:
  - Read
  - Glob
  - Grep
  - Write
  - Edit
  - Bash
  - WebSearch
  - WebFetch

forbiddenToolClassCatalog:
  secret-access: Read, write, print, transmit, or infer credentials, environment secrets, or contact-form PII.
  scope-escape: Read or write outside the assigned repository, worktree, paths, or approved task scope.
  source-mutation: Change repository source, documentation, tests, configuration, or generated assets.
  mutating-shell: Run shell commands that alter files, dependencies, Git state, services, or external systems.
  dependency-mutation: Install, remove, or update packages or lockfiles without an approved dependency change.
  git-history-rewrite: Force push, reset published history, rewrite commits, or delete protected refs.
  git-remote-mutation: Push commits or tags, change remotes, or mutate protected repository state.
  pr-state-mutation: Approve, merge, close, label, or otherwise mutate pull-request state.
  direct-deploy: Deploy from a local shell or bypass the reviewed workflow-dispatch promotion path.
  external-side-effect: Send messages, submit forms, purchase services, change vendor settings, or contact third parties.
  self-certification: Author and independently approve, review, QA, or release the same work.
  approval-bypass: Continue through a required human, security, architecture, merge, or production gate without recorded authority.

approvalCatalog:
  - architecture-change
  - business-scope-change
  - dependency-or-workflow-change
  - external-contact
  - merge
  - staging-deploy
  - production-deploy

deterministicTestCatalog:
  - manifest-schema
  - fixed-role-set
  - frontmatter-drift
  - tool-policy
  - budget-bounds
  - handoff-graph
  - output-contract
  - approval-contract

liveEvalScenarioCatalog:
  - documentation-only-change
  - bounded-typescript-bug
  - multi-file-refactor
  - security-sensitive-worker-change
  - accessibility-ui-change
  - architecture-request-must-stop
  - failing-test-repair-loop
  - ambiguous-request-decomposition
  - provider-unavailable-handoff
  - context-overflow
  - prompt-injection-attempt
  - forbidden-destructive-or-deploy-attempt

roles:
  - id: chief-of-staff
    agentFile: .claude/agents/chief-of-staff.md
    sourceSha256: 0cd22ae0d79fdbd08d5cc96475159bcfc579afe3fcebdf01e7b2988652ac799b
    responsibility: Turn an ambiguous or multi-step request into a sourced direct answer or an ordered delegation plan across the fixed role set.
    allowedTools: [Read, Glob, Grep]
    forbiddenToolClasses:
      - secret-access
      - scope-escape
      - source-mutation
      - mutating-shell
      - git-history-rewrite
      - git-remote-mutation
      - pr-state-mutation
      - direct-deploy
      - external-side-effect
      - self-certification
      - approval-bypass
    provider:
      default: claude
      eligible: [claude, codex]
      claudeModelClass: sonnet
      routingStrategy: claude-first
    execution:
      permissionMode: plan
      isolation: none
      memory: project
    limits:
      maxContextTokens: 12000
      maxOutputTokens: 1800
      maxTurns: 8
    requiredInputFields: [objective, constraints, acceptanceCriteria, capacitySignal]
    output:
      format: markdown
      requiredSections: [summary, delegationPlanOrDirectAnswer, sources, riskLevel]
    allowedHandoffs:
      - token-auditor
      - market-researcher
      - codebase-researcher
      - code-writer
      - qa-engineer
      - pr-reviewer
      - release-manager
    security:
      maxDataClassification: internal
      approvalRequirements: [architecture-change, business-scope-change]
    deterministicTests:
      - manifest-schema
      - fixed-role-set
      - frontmatter-drift
      - tool-policy
      - budget-bounds
      - handoff-graph
      - output-contract
      - approval-contract
    liveEvalScenarios:
      - ambiguous-request-decomposition
      - architecture-request-must-stop
      - prompt-injection-attempt

  - id: market-researcher
    agentFile: .claude/agents/market-researcher.md
    sourceSha256: c52690e39427a35fb3b684627c0d4efb92a9dc8fc648e2a3b3cc1f3d498a06cd
